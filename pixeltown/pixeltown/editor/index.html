<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Town — Resource Editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, sans-serif; font-size: 13px; }

      #editor-root { display: flex; flex-direction: column; width: 100%; height: 100%; }

      /* --- Toolbar --- */
      #toolbar {
        display: flex; align-items: center; gap: 8px;
        padding: 6px 12px;
        background: #16213e; border-bottom: 1px solid #0f3460;
        flex-shrink: 0;
      }
      #toolbar .toolbar-group { display: flex; gap: 4px; }
      #toolbar .toolbar-group + .toolbar-group { margin-left: 12px; border-left: 1px solid #0f3460; padding-left: 12px; }
      #toolbar button {
        background: #0f3460; color: #e0e0e0; border: 1px solid #1a1a4e;
        padding: 4px 10px; border-radius: 3px; cursor: pointer; font-size: 12px;
      }
      #toolbar button:hover { background: #1a4a80; }
      #toolbar button.active { background: #e94560; border-color: #e94560; }
      #toolbar .tab-btn { padding: 6px 14px; font-weight: bold; }
      #toolbar .title { font-family: 'Press Start 2P', monospace; font-size: 10px; color: #e94560; margin-right: 12px; }
      #toolbar .spacer { flex: 1; }
      #toolbar .status { font-size: 11px; color: #888; }

      /* --- Main area --- */
      #main-area { display: flex; flex: 1; overflow: hidden; }

      /* --- Sidebar palette --- */
      #sidebar {
        width: 220px; flex-shrink: 0;
        background: #16213e; border-right: 1px solid #0f3460;
        display: flex; flex-direction: column;
        overflow-y: auto;
      }
      #sidebar h3 { padding: 8px 10px; font-size: 11px; color: #e94560; border-bottom: 1px solid #0f3460; }
      .palette-grid {
        display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 8px;
      }
      .palette-item {
        aspect-ratio: 1; border: 2px solid transparent; border-radius: 3px;
        cursor: pointer; display: flex; align-items: center; justify-content: center;
        font-size: 10px; text-align: center; background: #1a1a2e;
      }
      .palette-item:hover { border-color: #e94560; }
      .palette-item.selected { border-color: #e94560; background: #2a1a3e; }

      /* --- Canvas area --- */
      #canvas-container { flex: 1; position: relative; overflow: hidden; background: #111; }
      #editor-canvas { display: block; width: 100%; height: 100%; }

      /* --- Property panel --- */
      #properties {
        width: 240px; flex-shrink: 0;
        background: #16213e; border-left: 1px solid #0f3460;
        overflow-y: auto; padding: 10px;
      }
      #properties h3 { font-size: 11px; color: #e94560; margin-bottom: 8px; }
      .prop-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
      .prop-row label { font-size: 11px; color: #aaa; }
      .prop-row input, .prop-row select {
        width: 120px; background: #1a1a2e; color: #e0e0e0; border: 1px solid #0f3460;
        padding: 3px 6px; border-radius: 2px; font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="editor-root">
      <!-- Toolbar -->
      <div id="toolbar">
        <span class="title">PixelTown Editor</span>
        <div class="toolbar-group">
          <button class="tab-btn active" data-tab="town">Town Map</button>
          <button class="tab-btn" data-tab="interior">Interior</button>
          <button class="tab-btn" data-tab="character">Character</button>
        </div>
        <div class="toolbar-group">
          <button id="btn-undo" title="Undo (Ctrl+Z)">&#8630; Undo</button>
          <button id="btn-redo" title="Redo (Ctrl+Shift+Z)">&#8631; Redo</button>
        </div>
        <div class="toolbar-group">
          <button id="btn-grid" title="Toggle Grid (G)">Grid</button>
        </div>
        <div class="toolbar-group">
          <button id="btn-save" title="Save JSON">&#128190; Save</button>
          <button id="btn-load" title="Load JSON">&#128194; Load</button>
        </div>
        <span class="spacer"></span>
        <span class="status" id="status-text">Ready</span>
      </div>

      <!-- Main area: sidebar + canvas + properties -->
      <div id="main-area">
        <div id="sidebar">
          <h3>Palette</h3>
          <div class="palette-grid" id="palette-grid">
            <!-- Populated by JS -->
          </div>
        </div>

        <div id="canvas-container">
          <canvas id="editor-canvas"></canvas>
        </div>

        <div id="properties">
          <h3>Properties</h3>
          <div id="prop-content">
            <p style="color:#666; font-size:11px;">Select an element to view properties.</p>
          </div>
        </div>
      </div>
    </div>

    <input type="file" id="file-input" accept=".json" style="display:none" />
    <script type="module" src="../src/editor/main.ts"></script>
  </body>
</html>
