<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Town</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; font-family: 'Press Start 2P', monospace; }

      /* ── Landing page ── */
      #landing {
        width: 100%; height: 100%;
        background: linear-gradient(180deg, #1a3a0a 0%, #2d5a1b 40%, #3a6b25 100%);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 40px;
        image-rendering: pixelated;
      }
      #landing h1 {
        font-size: 36px; color: #ffd700;
        text-shadow: 3px 3px 0 #8b6914, -1px -1px 0 #3e2510;
        letter-spacing: 4px;
      }
      #landing .subtitle {
        font-size: 10px; color: #a0c880;
        margin-top: -20px;
      }
      #landing .buttons {
        display: flex; gap: 24px; flex-wrap: wrap; justify-content: center;
      }
      #landing .btn {
        display: flex; flex-direction: column; align-items: center; gap: 10px;
        padding: 24px 32px;
        border: 3px solid #8b6914;
        border-radius: 6px;
        cursor: pointer;
        text-decoration: none;
        transition: transform 0.15s, box-shadow 0.15s;
        min-width: 200px;
      }
      #landing .btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 20px rgba(0,0,0,0.4);
      }
      #landing .btn-icon { font-size: 40px; }
      #landing .btn-label { font-size: 11px; }
      #landing .btn-desc { font-size: 7px; opacity: 0.7; }

      #landing .btn-play {
        background: linear-gradient(180deg, #4a7a3a, #3a6b25);
        color: #f5deb3;
        box-shadow: inset 0 0 0 2px #5a8a4a, 0 4px 12px rgba(0,0,0,0.3);
      }
      #landing .btn-editor {
        background: linear-gradient(180deg, #5c3a1e, #4a2e16);
        color: #f5deb3;
        box-shadow: inset 0 0 0 2px #6b4a2e, 0 4px 12px rgba(0,0,0,0.3);
      }

    </style>
  </head>
  <body>
    <!-- Landing page -->
    <div id="landing">
      <h1>Pixel Town</h1>
      <div class="subtitle">A cozy AI agent village</div>
      <div class="buttons">
        <a class="btn btn-play" href="/town/">
          <span class="btn-icon">&#x1F3E0;</span>
          <span class="btn-label">Enter Town</span>
          <span class="btn-desc">Watch your agents live &amp; work</span>
        </a>
        <a class="btn btn-editor" href="/editor/">
          <span class="btn-icon">&#x1F3A8;</span>
          <span class="btn-label">Resource Editor</span>
          <span class="btn-desc">Design maps, rooms &amp; characters</span>
        </a>
      </div>
    </div>

  </body>
</html>
