[project]
name = "miniclaw"
version = "0.3.2"
requires-python = ">=3.10"
dependencies = [
    "discord.py>=2.3",
    "httpx[http2]",
    "python-dotenv",
    "claude-agent-sdk>=0.1.48",
    "aiohttp>=3.9",
    "google-auth-oauthlib>=1.0",
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.0",
    "openai>=1.0",
    "edge-tts>=6.1",
    "pyyaml>=6.0",
    "lunardate>=0.2.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "lark-oapi>=1.5.3",
    "croniter>=1.0",
]

[project.optional-dependencies]
audio = [
    "pyaudio>=0.2.14",
    "pyobjc-framework-AVFoundation>=10.0; sys_platform == 'darwin'",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests that call real external APIs (deselect with '-m \"not integration\"')",
]
filterwarnings = [
    "ignore::DeprecationWarning:discord.*",
]

[tool.coverage.run]
source = ["bot"]
omit = ["bot/acp.py"]

[tool.coverage.report]
show_missing = true
fail_under = 60
