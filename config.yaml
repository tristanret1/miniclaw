llm:
  provider: anthropic
  anthropic:
    model: claude-sonnet-4-20250514
    api_url: https://api.anthropic.com/v1/messages
  codex:
    model: gpt-5.3-codex
    api_url: https://chatgpt.com/backend-api/codex/responses
  glm:
    model: glm-4.7-flash
    api_url: https://open.bigmodel.cn/api/paas/v4/chat/completions
  minimax:
    model: MiniMax-M2.7
    api_url: https://api.minimaxi.com/v1/text/chatcompletion_v2
  max_history: 50
  max_tokens: 4096
  tools_enabled: true

discord:
  greeting_channel_id: "1482258781860532344"
  allowed_dm_users: [769868293476843520]
  auto_reply:
    enabled: false
    channels: []
    chance: 0.1
    keywords: []
  stream:
    flush_interval: 0.1
    flush_chars: 50

gateway:
  voice:
    enabled: false
    sample_rate: 16000
    silence_threshold: 500
    silence_duration: 1.5
    conversation_timeout: 30.0
    playback_cooldown: 0.5
    wake_words: ["小圆"]
    tts_provider: volcengine
    tts_voice: cedar
    tts_model: gpt-4o-mini-tts
    tts_speed: 1.2
    stt_model: gpt-4o-transcribe
    stt_language: zh
    stt_prompt: ""
  volcengine:
    tts_resource_id: "volc.service_type.10029"
    tts_speaker: "zh_male_beijingxiaoye_emo_v2_mars_bigtts"
  sms:
    enabled: false
    agent: default
    webhook_port: 8080
    webhook_url: ""
  imessage:
    enabled: false
    cli_path: imsg
    db_path: ""
    allow_from: []
    service: auto
  heartbeat:
    enabled: false
    interval: "30m"
    channel_id: ""
    active_start: ""
    active_end: ""
    active_tz: ""
    ack_max_chars: 300
    isolated: true
  api:
    enabled: false
    host: "127.0.0.1"
    port: 8766
    api_key: ""
  feishu:
    enabled: true
    agent: feishu
    allow_from: []

storage:
  backend: sqlite
  sqlite:
    sessions_path: workspace/sessions.db
    memory_path: workspace/memory/memory.db

services:
  google_calendar:
    enabled: false
    life_calendar_id: ""
    work_calendar_id: ""
  cron:
    enabled: true
    timezone: America/Vancouver
    max_concurrent: 5
    tick_interval_min: 2.0
    tick_interval_max: 60.0
    backoff: [30, 60, 300, 900, 3600]
  health:
    enabled: true
  kb:
    enabled: true
    root: ~/kb
    auto_compile: true
    compile_timeout: 600
    query_timeout: 300
  timeouts:
    http_read: 120
    http_connect: 10
    exec_default: 30
    exec_max: 120
    acp_max: 600
